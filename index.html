<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Очень Большая Бродилка — веб-прототип</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css?v=20260709-0001" />
  </head>
  <body data-ui-style="classic" data-font-style="standard">
    <main class="app-shell">
      <section class="score-strip" id="scoreStrip" aria-label="Игроки"></section>
      <div id="monsterRageIndicator" class="monster-rage-indicator" aria-live="polite" hidden></div>

      <section class="play-area">
        <article class="board-panel" aria-label="Игровое поле">
          <div class="map-wrap">
            <div id="eventToast" class="event-toast" role="button" tabindex="0" aria-live="polite" hidden></div>
            <div id="monsterDefeatBanner" class="monster-defeat-banner" aria-live="polite" hidden></div>
            <div id="coinDoubleBanner" class="coin-double-banner" aria-live="polite" hidden></div>
            <div id="finalBattleHud" class="final-battle-hud" aria-live="polite" hidden></div>
            <div id="winnerPopup" class="winner-popup" aria-live="polite" hidden></div>
            <div id="choicePanel" class="choice-panel" role="dialog" aria-live="polite" hidden></div>
            <div id="board" class="board"></div>
          </div>
          <div class="board-header">
            <div class="dice-panel">
              <span id="diceValue">-</span>
              <button id="infoHistoryBtn" class="info-history-button" type="button" aria-label="Показать хронику" title="Хроника" aria-haspopup="dialog" aria-expanded="false">
                <span class="info-history-glyph" aria-hidden="true">
                  <svg class="info-history-icon" viewBox="0 0 48 48" focusable="false">
                    <path class="info-history-scroll-paper" d="M12.9 7.8h22.4c5 0 8.2 3.2 8.2 8.2v19.8" />
                    <path class="info-history-scroll-roll" d="M12.9 7.8c-4 0-6.7 2.6-7.9 7.8h13.2c-.5-5.1-2.3-7.8-5.3-7.8Z" />
                    <path class="info-history-scroll-side" d="M18.2 15.6v20.2c0 4.4-2 6.6-5.6 6.6" />
                    <path class="info-history-scroll-bottom" d="M18.2 35.8h20.4c3.8 0 6.2 2.4 6.2 6.6H12.6c3.7 0 5.6-2.3 5.6-6.6Z" />
                    <path class="info-history-scroll-line" d="M24.3 17.2h11.2" />
                    <path class="info-history-scroll-line" d="M24.3 23.2h11.2" />
                    <path class="info-history-scroll-line" d="M24.3 29.2h11.2" />
                  </svg>
                </span>
              </button>
              <div id="fieldEffect" class="field-effect"></div>
              <div id="turnActions" class="turn-actions" aria-label="Доступные действия"></div>
              <button id="rollBtn">Бросить <img class="dice-icon" src="./assets/icons/dice.png?v=20260524-0305" alt="" aria-hidden="true"></button>
            </div>
          </div>
        </article>

        <aside class="side-panel" aria-label="Информация партии">
          <section class="game-settings" aria-label="Панель партии">
            <div class="season-controls">
              <label>
                <span class="control-label-copy">Игроков</span>
                <select id="playerCount">
                  <option value="2" selected>2</option>
                  <option value="3">3</option>
                  <option value="4">4</option>
                </select>
              </label>
              <label>
                <span class="control-label-copy">Ботов</span>
                <select id="botCount">
                  <option value="0" selected>0</option>
                  <option value="1">1</option>
                  <option value="2">2</option>
                  <option value="3">3</option>
                  <option value="4">4</option>
                </select>
              </label>
              <div class="header-icon-actions" aria-label="Быстрые действия">
                <button id="referenceHeaderBtn" class="secondary header-icon-button reference-header-toggle" type="button" title="Показать карты и поля" aria-label="Показать карты и поля" aria-pressed="false">
                  <img class="reference-header-icon" src="./assets/icons/reference_cards.svg" alt="" aria-hidden="true">
                </button>
                <button id="historyHeaderBtn" class="secondary header-icon-button history-header-toggle" type="button" title="История" aria-label="История" aria-pressed="false">
                  <svg class="history-header-icon" viewBox="0 0 512 512" aria-hidden="true">
                    <defs>
                      <linearGradient id="historyGold" x1="132" x2="384" y1="102" y2="410" gradientUnits="userSpaceOnUse">
                        <stop offset="0" stop-color="#f0d58d"/>
                        <stop offset="0.54" stop-color="#cf9439"/>
                        <stop offset="1" stop-color="#80531f"/>
                      </linearGradient>
                    </defs>
                    <g fill="none" stroke="url(#historyGold)" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M146 158v252h210" stroke-width="20" opacity="0.58"/>
                      <path d="M178 108h150l58 58v238H178z" stroke-width="24"/>
                      <path d="M328 112v58h56" stroke-width="22"/>
                      <path d="M220 226h112M220 278h112M220 330h78" stroke-width="24"/>
                    </g>
                  </svg>
                </button>
                <button id="phoneRoomHeaderBtn" class="secondary header-icon-button phone-room-toggle" type="button" title="Играть с телефонами" aria-label="Играть с телефонами" aria-pressed="false">
                  <svg class="phone-header-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <rect x="7.25" y="3.25" width="9.5" height="17.5" rx="2.15" />
                    <path d="M10.15 5.65h3.7M10.75 18.05h2.5" />
                  </svg>
                </button>
                <button id="settingsToggle" class="secondary settings-toggle header-icon-button" type="button" title="Настройки" aria-label="Настройки" aria-expanded="false">
                  <img class="settings-icon" src="./assets/icons/settings_gear.svg?v=20260621-2257" alt="" aria-hidden="true">
                </button>
                <button id="fullscreenBtn" class="secondary fullscreen-toggle header-icon-button" type="button" title="Открыть игру на весь экран" aria-label="На весь экран">
                  <img class="fullscreen-icon" src="./assets/icons/fullscreen_button.svg?v=20260621-2305" alt="" aria-hidden="true">
                </button>
                <span id="phoneRoomHeaderFeedback" class="phone-room-header-feedback" role="status" aria-live="polite" hidden>Комната скопирована</span>
              </div>
              <button id="newGameBtn" class="secondary">Новая игра</button>
            </div>
            <section class="phone-room-panel" aria-label="Мобильные контроллеры" hidden>
              <div class="phone-room-header">
                <strong>Телефоны</strong>
                <div class="phone-room-header-actions">
                  <button id="phoneRoomQrBtn" class="secondary phone-room-qr-button" type="button" title="Показать QR-код" aria-label="Показать QR-код" aria-haspopup="dialog" aria-expanded="false" disabled>
                    <img class="phone-room-qr-icon" src="./assets/icons/qr_code.svg?v=20260626-1656" alt="" aria-hidden="true">
                  </button>
                  <button id="createPhoneRoomBtn" class="secondary phone-room-refresh-button" type="button" title="Создать комнату" aria-label="Создать комнату">
                    <img class="phone-room-refresh-icon" src="./assets/icons/refresh_room.svg?v=20260626-1700" alt="" aria-hidden="true">
                  </button>
                  <button id="copyPhoneRoomUrlBtn" class="secondary phone-room-copy" type="button" title="Скопировать ссылку" aria-label="Скопировать ссылку" disabled>
                    <img class="phone-room-copy-icon" src="./assets/icons/copy_link.svg?v=20260626-1652" alt="" aria-hidden="true">
                  </button>
                  <button id="phoneRoomSettingsToggle" class="secondary phone-room-settings-toggle" type="button" title="Настройки телефонов" aria-label="Настройки телефонов" aria-expanded="false" aria-controls="phoneRoomSettingsBody">
                    <img class="phone-room-settings-icon" src="./assets/icons/settings_gear.svg?v=20260626-0342" alt="" aria-hidden="true">
                  </button>
                </div>
              </div>
              <div id="phoneRoomStatus" class="phone-room-status">Комната не создана</div>
              <div id="phoneRoomDetails" class="phone-room-details" hidden>
                <div class="phone-room-code-card">
                  <span>Код</span>
                  <b id="phoneRoomCode">-</b>
                </div>
                <label class="phone-room-link-card">
                  <span>Ссылка</span>
                  <input id="phoneRoomUrl" type="text" readonly value="" />
                </label>
              </div>
              <section class="phone-room-settings" aria-label="Настройки телефонов">
                <div id="phoneRoomSettingsBody" class="phone-room-settings-body" hidden>
                  <div class="phone-room-settings-grid">
                    <label class="phone-room-mode">
                      <span>Режим</span>
                      <select id="phoneRoomMode">
                        <option value="full" selected>Полный контроллер</option>
                        <option value="big-button">Большая кнопка</option>
                      </select>
                    </label>
                    <label class="cheat-toggle phone-dice-toggle">
                      <input id="phoneRoomDice" type="checkbox" />
                      <span>Не отображать кубики</span>
                    </label>
                    <label class="cheat-toggle phone-card-text-toggle">
                      <input id="phoneRoomCardsText" type="checkbox" checked />
                      <span>Текст вместо карт</span>
                    </label>
                  </div>
                  <div id="phoneRoomControllers" class="phone-room-controllers"></div>
                </div>
              </section>
            </section>
            <div id="settingsPanel" class="settings-panel" hidden>
              <div class="settings-action-pair auto-playtest-controls" aria-label="Автопрогон бот-партий">
                <span class="auto-playtest-title">Автопрогон</span>
                <button class="secondary" type="button" data-auto-playtest-runs="1">1</button>
                <button class="secondary" type="button" data-auto-playtest-runs="10">10</button>
                <button class="secondary" type="button" data-auto-playtest-runs="100">100</button>
                <span id="autoPlaytestStatus" class="auto-playtest-status" aria-live="polite"></span>
              </div>
              <div class="exact-move-row" aria-label="Чит точного движения активного игрока">
                <label class="settings-select exact-move-setting">
                  <span>Пройти</span>
                  <input id="exactMoveAmount" type="number" min="0" step="1" value="4" />
                </label>
                <button id="exactMoveBtn" class="secondary" type="button">Идти</button>
              </div>
              <div id="modifierPlayerStatus" class="modifier-player-status" aria-live="polite"></div>
              <div class="modifier-preset-row" aria-label="Шаги выбранного игрока">
                <span>Шаги</span>
                <button class="secondary" type="button" data-step-bonus-preset="-5">-5</button>
                <button class="secondary" type="button" data-step-bonus-preset="5">+5</button>
                <button class="secondary" type="button" data-step-bonus-preset="-50">-50</button>
                <button class="secondary" type="button" data-step-bonus-preset="50">+50</button>
              </div>
              <div class="modifier-preset-row" aria-label="Сила выбранного игрока">
                <span>Сила</span>
                <button class="secondary" type="button" data-battle-bonus-preset="-5">-5</button>
                <button class="secondary" type="button" data-battle-bonus-preset="5">+5</button>
                <button class="secondary" type="button" data-battle-bonus-preset="-50">-50</button>
                <button class="secondary" type="button" data-battle-bonus-preset="50">+50</button>
              </div>
              <label class="settings-select">
                <span>Кубиков</span>
                <select id="diceCount">
                  <option value="1" selected>1</option>
                  <option value="2">2</option>
                  <option value="3">3</option>
                  <option value="4">4</option>
                </select>
              </label>
              <label class="settings-select">
                <span>Поле</span>
                <select id="boardSelect">
                  <option value="field1">Поле 1</option>
                  <option value="field2" selected>Поле 2</option>
                </select>
              </label>
              <label class="settings-select">
                <span>UI</span>
                <select id="uiStyle">
                  <option value="classic" selected>Классический</option>
                  <option value="tabletop">Настольный</option>
                </select>
              </label>
              <label class="settings-select">
                <span>Скорость ботов</span>
                <select id="botSpeed">
                  <option value="standard" selected>Стандартно</option>
                  <option value="fast">Быстро</option>
                </select>
              </label>
              <label class="cheat-toggle">
                <input id="autoRevealCards" type="checkbox" />
                <span>Сразу открывать карты</span>
              </label>
              <label class="cheat-toggle">
                <input id="randomFirstPlayer" type="checkbox" />
                <span>Случайный первый игрок</span>
              </label>
              <label class="cheat-toggle">
                <input id="showWalkPath" type="checkbox" />
                <span>Не показывать контур хода</span>
              </label>
              <label class="cheat-toggle">
                <input id="hidePlayers" type="checkbox" />
                <span>Скрыть игроков</span>
              </label>
            </div>
          </section>
          <section class="tadam-card">
            <div class="section-title">
              <h2>ТАДАМ!</h2>
              <span class="pill">до 3 карт</span>
            </div>
            <div id="tadamTable" class="tadam-table"></div>
          </section>
        </aside>
      </section>

      <section class="lower-grid">
        <article id="referencePanel" class="reference-panel" aria-label="Справочник карт и полей" hidden>
          <section class="reference-toggle-panel" aria-label="Показать карты и поля">
            <strong>Показать карты и поля</strong>
            <div class="reference-toggle-list">
              <button class="secondary reference-toggle" type="button" data-reference-toggle="good" aria-pressed="false">
                <img class="reference-toggle-icon" src="./assets/cards/good_back.png" alt="" aria-hidden="true">
                <span class="reference-toggle-label">Хорошо</span>
              </button>
              <button class="secondary reference-toggle" type="button" data-reference-toggle="bad" aria-pressed="false">
                <img class="reference-toggle-icon" src="./assets/cards/bad_back.png" alt="" aria-hidden="true">
                <span class="reference-toggle-label">Плохо</span>
              </button>
              <button class="secondary reference-toggle" type="button" data-reference-toggle="shop" aria-pressed="false">
                <img class="reference-toggle-icon" src="./assets/cards/shop_back.png" alt="" aria-hidden="true">
                <span class="reference-toggle-label">Лавка Джо</span>
              </button>
              <button class="secondary reference-toggle" type="button" data-reference-toggle="tadam" aria-pressed="false">
                <img class="reference-toggle-icon" src="./assets/cards/tadam_back.png" alt="" aria-hidden="true">
                <span class="reference-toggle-label">Тадам!</span>
              </button>
              <button class="secondary reference-toggle" type="button" data-reference-toggle="event" aria-pressed="false">
                <img class="reference-toggle-icon" src="./assets/cards/event_back.png" alt="" aria-hidden="true">
                <span class="reference-toggle-label">События</span>
              </button>
              <button class="secondary reference-toggle" type="button" data-reference-toggle="fields" aria-pressed="false">
                <img class="reference-toggle-icon reference-toggle-icon-field" src="./assets/icons/start_512.png" alt="" aria-hidden="true">
                <span class="reference-toggle-label">Поля</span>
              </button>
            </div>
          </section>
          <div id="referenceOutput" class="reference-output" hidden></div>
        </article>
        <article id="historyPanel" class="history-panel" hidden>
          <div class="section-title">
            <h2>История</h2>
            <button id="saveHistoryBtn" class="history-save" type="button">Сохранить</button>
          </div>
          <div id="gameHistory" class="game-history"></div>
        </article>
      </section>

      <div id="infoHistoryPopup" class="info-history-popup" role="dialog" aria-modal="true" aria-labelledby="infoHistoryTitle" hidden>
        <button class="info-history-backdrop" type="button" data-info-history-close aria-label="Закрыть хронику"></button>
        <section class="info-history-card">
          <div class="info-history-head">
            <div>
              <h2 id="infoHistoryTitle">Хроника</h2>
            </div>
            <div class="info-history-head-actions">
              <button id="infoHistoryFullBtn" class="info-history-action" type="button">Вся хроника</button>
              <button id="infoHistoryCopyBtn" class="info-history-action" type="button">Копировать</button>
              <span id="infoHistoryCopyFeedback" class="info-history-copy-feedback" role="status" aria-live="polite" hidden>Хроника скопирована</span>
              <button id="infoHistoryCloseBtn" class="info-history-close" type="button" aria-label="Закрыть хронику">×</button>
            </div>
          </div>
          <div class="info-history-list-wrap">
            <div id="infoHistoryListTitle" class="info-history-list-title">Последние действия</div>
            <ol id="gameLog" class="game-log info-history-log"></ol>
          </div>
        </section>
      </div>

      <div id="playerShopPopup" class="player-shop-popup" role="dialog" aria-modal="true" aria-labelledby="playerShopTitle" hidden>
        <button class="player-shop-backdrop" type="button" data-player-shop-close aria-label="Закрыть карты игрока"></button>
        <section class="player-shop-card">
          <div class="player-shop-head">
            <div>
              <span id="playerShopSubtitle" class="player-shop-kicker">Карты игрока</span>
              <h2 id="playerShopTitle">Карты игрока</h2>
            </div>
            <button id="playerShopCloseBtn" class="player-shop-close" type="button" aria-label="Закрыть карты игрока">×</button>
          </div>
          <div id="playerShopBody" class="player-shop-body"></div>
        </section>
      </div>

      <div id="phoneRoomQrPopup" class="phone-room-qr-popup" role="dialog" aria-modal="true" aria-label="QR-код комнаты" hidden>
        <button class="phone-room-qr-backdrop" type="button" data-phone-room-qr-close aria-label="Закрыть QR-код"></button>
        <section class="phone-room-qr-card">
          <div id="phoneRoomQrCode" class="phone-room-qr-code" aria-label="QR-код для подключения телефона"></div>
        </section>
      </div>

    </main>

    <script type="module" src="./src/game.js?v=20260709-0002"></script>
  </body>
</html>

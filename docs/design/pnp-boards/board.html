<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PnP Player Board</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@700;800;900&display=swap" rel="stylesheet">
<!--
  Печатный планшет игрока PnP, стиль C «картонные жетоны» (решение пользователя, 18 октября 2026).
  Правки пользователя: только треки силы 0…+10, шагов 0…+10 через 2 и кубиков 1–4, окошки «+10 за круг».
  Игроки отличаются только цветом рамки. Фон — дерево таверны в свете свечей (tavern_wood.jpg, арт Codex CLI).
  Все размеры в мм: печать 100 %. Клетки 13,5 мм под маркеры 12 мм.
  ?p=dog|cat|otter|alpaca — цвет игрока, ?s=3 — масштаб кадра.
  Кадр одного планшета: python3 tools/probe.py shot --path "/docs/design/pnp-boards/board.html?p=dog&s=3" --size 2778x816
-->
<style>
  :root {
    --ink: #3a1d08;
    --cream: #fbf1d9;
    --line: #3a1d08;
    --player: #8b1713;
    --cell: 13.5mm;
    --gap: 1.3mm;
  }
  * { box-sizing: border-box; }
  @page { size: A4 landscape; margin: 0; }
  html, body { margin: 0; background: #fff; }
  body { zoom: var(--s, 1); color: var(--ink); font: 800 4mm/1.1 "Rubik", system-ui, sans-serif; }
  @media print { body { zoom: 1; } }

  /* Вырубной картон: светлая кайма под вырезание, тёмный контур, кольцо цвета игрока, внутри дерево таверны */
  .board {
    width: 245mm;
    height: 72mm;
    border-radius: 7mm;
    background: var(--cream);
    border: 0.6mm solid var(--line);
    padding: 2.6mm;
  }
  .board-face {
    position: relative;
    height: 100%;
    border-radius: 5mm;
    border: 0.6mm solid var(--line);
    box-shadow: inset 0 0 0 2.2mm var(--player), inset 0 0 0 2.8mm var(--line);
    background:
      radial-gradient(ellipse 70% 90% at 50% 45%, rgba(255, 196, 110, 0.18), transparent 70%),
      url("./tavern_wood.jpg") center / cover;
    padding: 6.2mm 7mm;
    display: grid;
    align-content: center;
    gap: 2.6mm;
    overflow: hidden;
  }

  .track { display: grid; grid-template-columns: 30mm minmax(0, 1fr) 24mm; align-items: center; gap: 3mm; }
  .track-label {
    display: grid; grid-template-columns: 11mm 1fr; align-items: center; gap: 1.6mm;
    color: var(--cream);
    font: 900 3.9mm/1 "Rubik";
    text-transform: uppercase;
    letter-spacing: .03em;
    text-shadow: 0 0.35mm 0 var(--line), 0 0 0.9mm rgba(30, 12, 2, .9);
  }
  .track-label img { width: 11mm; height: 11mm; object-fit: contain; filter: drop-shadow(0 0.5mm 0.4mm rgba(20, 8, 0, .6)); }
  .cells { display: flex; gap: var(--gap); }
  .cell {
    width: var(--cell); height: var(--cell);
    display: grid; place-items: center;
    border-radius: 2.6mm;
    background: linear-gradient(#fff8e6, #f3e2b9);
    border: 0.45mm solid var(--line);
    font: 900 4.6mm/1 "Rubik";
    box-shadow: inset 0 -0.8mm 0 rgba(90, 52, 19, .16), 0 0.5mm 0.6mm rgba(20, 8, 0, .45);
  }
  .cell.is-start { outline: 0.8mm solid var(--player); outline-offset: -1.7mm; }
  .lap {
    height: var(--cell); width: 24mm;
    display: grid; place-items: center;
    border: 0.5mm dashed var(--cream); border-radius: 2.6mm;
    background: rgba(40, 18, 4, .35);
    color: var(--cream);
    font: 900 3.2mm/1.05 "Rubik"; text-align: center;
    text-shadow: 0 0.3mm 0 var(--line);
  }
</style>
</head>
<body>
<div class="board">
  <div class="board-face" id="tracks"></div>
</div>
<script>
  const colors = { dog: "#8b1713", cat: "#4b1a78", otter: "#0b748b", alpaca: "#d56b00" };
  const params = new URLSearchParams(location.search);
  const root = document.documentElement.style;
  root.setProperty("--player", colors[params.get("p")] || colors.dog);
  root.setProperty("--s", Number(params.get("s")) || 1);

  const icons = "../../../assets/icons/";
  const steps = (from, to, by = 1) => Array.from({ length: Math.floor((to - from) / by) + 1 }, (_, i) => from + i * by);
  const tracks = [
    ["Сила", icons + "strength_sword_512.png", steps(0, 10), true],
    ["Шаги", icons + "steps_512.png", steps(0, 10, 2), true],
    ["Кубики", icons + "dice.png", steps(1, 4), false],
  ];
  document.getElementById("tracks").innerHTML = tracks.map(([label, icon, values, signed]) => `
    <div class="track">
      <div class="track-label"><img src="${icon}" alt="">${label}</div>
      <div class="cells">${values.map((v, i) =>
        `<span class="cell${i === 0 ? " is-start" : ""}">${signed && v > 0 ? "+" + v : v}</span>`).join("")}</div>
      ${signed ? '<div class="lap">+10<br>за круг</div>' : "<span></span>"}
    </div>`).join("");
</script>
</body>
</html>
